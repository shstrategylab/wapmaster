<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실제 상담 사례 — 언행심리마스터</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:    #d4a843;
      --gold2:   #b8860b;
      --dark:    #100e0a;
      --dark2:   #1a1208;
      --paper:   #f7f3ee;
      --paper2:  #f0ebe4;
      --text:    #1e1a14;
      --muted:   #6b5e4a;
      --border:  rgba(184,134,11,0.25);
      --ink:     #5b6b8a;
      --ink2:    #46577a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, var(--paper), var(--paper2));
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(16,14,10,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212,168,67,0.2);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 64px;
    }
    .nav-logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 18px; font-weight: 700;
      color: #fff; text-decoration: none; letter-spacing: 1px;
    }
    .nav-logo span { color: var(--gold); }
    .nav-back {
      font-size: 13px; color: rgba(255,255,255,0.6);
      text-decoration: none; display: flex; align-items: center; gap: 6px;
      transition: color .2s;
    }
    .nav-back:hover { color: var(--gold); }
    .nav-back svg { width: 16px; height: 16px; }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(160deg, var(--dark) 0%, var(--dark2) 100%);
      padding: 80px 40px 70px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 120%, rgba(184,134,11,0.2) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(212,168,67,0.15);
      border: 1px solid rgba(212,168,67,0.4);
      border-radius: 100px; padding: 7px 20px;
      font-size: 11px; font-weight: 700; color: var(--gold);
      letter-spacing: 4px; text-transform: uppercase;
      margin-bottom: 28px;
    }
    .hero h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(28px, 4vw, 52px);
      color: #fff; line-height: 1.3; margin-bottom: 16px;
    }
    .hero h1 em { font-style: normal; color: var(--gold); }
    .hero p {
      font-size: 15px; color: rgba(255,255,255,0.55);
      line-height: 1.8; max-width: 480px; margin: 0 auto;
    }

    /* ── TYPE TABS (신규) ── */
    .type-tabs {
      max-width: 960px; margin: 0 auto;
      padding: 32px 24px 0;
      display: flex; gap: 10px; flex-wrap: wrap;
      justify-content: center;
    }
    .type-tab {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted); font-size: 13px; font-weight: 600;
      padding: 9px 22px; border-radius: 100px;
      cursor: pointer; transition: all .2s;
      font-family: 'Noto Sans KR', sans-serif;
      display: flex; align-items: center; gap: 8px;
    }
    .type-tab .type-tab-count {
      font-size: 11px; font-weight: 700;
      background: rgba(184,134,11,0.1);
      color: var(--gold2);
      border-radius: 100px; padding: 1px 8px;
    }
    .type-tab:hover { border-color: rgba(212,168,67,0.6); }
    .type-tab.active {
      background: var(--dark); border-color: var(--dark);
      color: var(--gold);
    }
    .type-tab.active .type-tab-count {
      background: rgba(212,168,67,0.2); color: var(--gold);
    }
    .type-tab[data-type="칼럼"].active {
      background: var(--ink2); border-color: var(--ink2); color: #fff;
    }
    .type-tab[data-type="칼럼"].active .type-tab-count {
      background: rgba(255,255,255,0.18); color: #fff;
    }

    /* ── CONTROLS ── */
    .controls {
      max-width: 960px; margin: 0 auto;
      padding: 24px 24px 0;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .count {
      font-size: 13px; color: var(--muted);
    }
    .count strong { color: var(--gold); font-weight: 700; }
    .tag-filters {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .tag-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted); font-size: 12px;
      padding: 5px 14px; border-radius: 100px;
      cursor: pointer; transition: all .2s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .tag-btn:hover, .tag-btn.active {
      background: var(--gold); border-color: var(--gold);
      color: var(--dark); font-weight: 600;
    }

    /* ── GRID ── */
    .grid {
      max-width: 960px; margin: 0 auto;
      padding: 28px 24px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* ── CARD ── */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 26px 24px;
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 14px;
      transition: transform .25s, box-shadow .25s, border-color .25s;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--gold2), var(--gold));
      opacity: 0; transition: opacity .25s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(184,134,11,0.12);
      border-color: rgba(212,168,67,0.5);
    }
    .card:hover::before { opacity: 1; }

    /* 칼럼 카드 변형 */
    .card.is-column {
      background: linear-gradient(180deg, #fff 0%, #f8f9fc 100%);
    }
    .card.is-column::before {
      background: linear-gradient(90deg, var(--ink2), var(--ink));
    }
    .card.is-column:hover {
      box-shadow: 0 16px 40px rgba(70,87,122,0.14);
      border-color: rgba(70,87,122,0.4);
    }

    .card-top-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .card-date {
      font-size: 11px; color: var(--muted);
      letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
    }
    .card-date::before {
      content: '';
      display: inline-block; width: 6px; height: 6px;
      background: var(--gold); border-radius: 50%;
    }
    .card.is-column .card-date::before { background: var(--ink2); }

    .type-badge {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 10px; border-radius: 100px;
      background: rgba(184,134,11,0.1); color: var(--gold2);
      flex-shrink: 0;
    }
    .type-badge.col {
      background: rgba(70,87,122,0.12); color: var(--ink2);
    }

    .card-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 18px; font-weight: 700;
      line-height: 1.45; color: var(--text);
    }
    .card-subtitle {
      font-size: 13px; color: var(--muted);
      line-height: 1.5; margin-top: -6px;
    }
    .card-summary {
      font-size: 13px; color: #5a5040;
      line-height: 1.75;
      border-top: 1px solid rgba(184,134,11,0.12);
      padding-top: 14px;
      flex: 1;
    }
    .card.is-column .card-summary { border-top-color: rgba(70,87,122,0.14); }
    .card-tags {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .tag {
      font-size: 11px; font-weight: 600;
      background: rgba(184,134,11,0.08);
      color: var(--gold2); border-radius: 6px;
      padding: 3px 10px;
    }
    .card.is-column .tag {
      background: rgba(70,87,122,0.08); color: var(--ink2);
    }
    .card-arrow {
      align-self: flex-end;
      font-size: 12px; color: var(--gold);
      display: flex; align-items: center; gap: 4px;
      margin-top: 4px; font-weight: 600;
      opacity: 0; transition: opacity .2s;
    }
    .card.is-column .card-arrow { color: var(--ink2); }
    .card:hover .card-arrow { opacity: 1; }

    /* ── EMPTY ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center; padding: 80px 0;
      color: var(--muted); font-size: 15px;
    }

    /* ── LOADING ── */
    .loading {
      text-align: center; padding: 100px 0;
      color: var(--muted); font-size: 15px;
    }
    .loading::after {
      content: ''; display: block; width: 32px; height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%; margin: 20px auto 0;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ── */
    footer {
      background: var(--dark);
      padding: 32px 40px;
      text-align: center;
      border-top: 1px solid rgba(212,168,67,0.15);
    }
    footer .logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 16px; color: var(--gold); margin-bottom: 8px;
    }
    footer p { font-size: 12px; color: rgba(255,255,255,0.3); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      .hero { padding: 60px 24px 50px; }
      .type-tabs { padding: 24px 20px 0; }
      .controls { padding: 20px 20px 0; }
      .grid { padding: 20px 20px 60px; grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <nav>
    <a class="nav-logo" href="../index.html">언행심리<span>마스터</span></a>
    <a class="nav-back" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      메인으로
    </a>
  </nav>

  <div class="hero">
    <div class="hero-badge">Real Consulting Cases &amp; Columns</div>
    <h1>실제 <em>상담 사례</em></h1>
    <p>언행심리마스터 도현(道賢)의 실제 상담 기록과 시론.<br>패턴을 읽고, 구조를 바꾸고, 관계를 회복한 이야기들 — 그리고 잠시 쉬어가는 생각들.</p>
  </div>

  <div class="type-tabs" id="typeTabs"></div>

  <div class="controls">
    <div class="count" id="count">불러오는 중...</div>
    <div class="tag-filters" id="tagFilters"></div>
  </div>

  <div class="grid" id="grid">
    <div class="loading">사례를 불러오는 중입니다</div>
  </div>

  <footer>
    <div class="logo">언행심리마스터</div>
    <p>언행심리마스터 · 도현(道賢)</p>
  </footer>

  <script>
    let allCases = [];
    let activeTag = null;
    let activeType = null; // null = 전체

    async function loadCases() {
      try {
        const res = await fetch('../cases-index.json?v=' + Date.now());
        const data = await res.json();
        allCases = data.cases.slice().reverse(); // 최신순
        buildTypeTabs();
        buildTagFilters();
        applyFilters();
      } catch (e) {
        document.getElementById('grid').innerHTML =
          '<div class="empty">사례를 불러올 수 없습니다.<br>잠시 후 다시 시도해 주세요.</div>';
        document.getElementById('count').textContent = '';
      }
    }

    function getType(c) {
      return c.type || '상담사례';
    }

    function buildTypeTabs() {
      const counts = { '상담사례': 0, '칼럼': 0 };
      allCases.forEach(c => {
        const t = getType(c);
        counts[t] = (counts[t] || 0) + 1;
      });

      const tabs = [
        { key: null, label: '전체', count: allCases.length },
        { key: '상담사례', label: '상담사례', count: counts['상담사례'] || 0 },
        { key: '칼럼', label: '칼럼 · 시론', count: counts['칼럼'] || 0 },
      ].filter(t => t.key === null || t.count > 0);

      const container = document.getElementById('typeTabs');
      container.innerHTML = '';
      tabs.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'type-tab' + (activeType === t.key ? ' active' : '');
        if (t.key) btn.dataset.type = t.key;
        btn.innerHTML = `${t.label} <span class="type-tab-count">${t.count}</span>`;
        btn.onclick = () => {
          activeType = t.key;
          document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyFilters();
        };
        container.appendChild(btn);
      });
    }

    function buildTagFilters() {
      const tagSet = new Set();
      allCases.forEach(c => (c.tags || []).forEach(t => tagSet.add(t)));
      const container = document.getElementById('tagFilters');
      container.innerHTML = '';
      [...tagSet].forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'tag-btn';
        btn.textContent = '#' + tag;
        btn.onclick = () => filterByTag(tag, btn);
        container.appendChild(btn);
      });
    }

    function filterByTag(tag, btn) {
      if (activeTag === tag) {
        activeTag = null;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      } else {
        activeTag = tag;
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      applyFilters();
    }

    function applyFilters() {
      let filtered = allCases;
      if (activeType) {
        filtered = filtered.filter(c => getType(c) === activeType);
      }
      if (activeTag) {
        filtered = filtered.filter(c => (c.tags || []).includes(activeTag));
      }
      renderCards(filtered);
    }

    function renderCards(cases) {
      const grid = document.getElementById('grid');
      const countEl = document.getElementById('count');

      countEl.innerHTML = `총 <strong>${cases.length}</strong>개의 글`;

      if (cases.length === 0) {
        grid.innerHTML = '<div class="empty">해당하는 글이 없습니다.</div>';
        return;
      }

      grid.innerHTML = cases.map(c => {
        const type = getType(c);
        const isColumn = type === '칼럼';
        return `
        <a class="card${isColumn ? ' is-column' : ''}" href="../${c.file}">
          <div class="card-top-row">
            <div class="card-date">${formatDate(c.date)}</div>
            <span class="type-badge${isColumn ? ' col' : ''}">${isColumn ? '칼럼 · 시론' : '상담사례'}</span>
          </div>
          <div class="card-title">${c.title}</div>
          ${c.subtitle ? `<div class="card-subtitle">${c.subtitle}</div>` : ''}
          <div class="card-summary">${c.summary}</div>
          <div class="card-tags">
            ${(c.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}
          </div>
          <div class="card-arrow">자세히 보기 →</div>
        </a>
      `;
      }).join('');
    }

    function formatDate(str) {
      if (!str) return '';
      const [y, m, d] = str.split('-');
      return `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;
    }

    loadCases();
  </script>

</body>
</html>
